name: Test-Android

on:
  # 仅允许手动触发
  workflow_dispatch:

jobs:
  Test-Android:
    # 固定 24.04:ubuntu-latest 正在灰度从 24.04 切到 26.04,行为会变
    runs-on: ubuntu-24.04
    # 全量采集可能一两小时(单 job 硬上限 6 小时)
    timeout-minutes: 360

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      # 步骤 1: 克隆逻辑仓库到【子目录】(所有业务逻辑都在里面)
      - name: Clone Private Logic Repository
        env:
          MY_GITHUB_MINI_ACTION_LOGIC_URL: ${{ secrets.MY_GITHUB_MINI_ACTION_LOGIC_URL }}
        run: |
          # 使用 ./logic 子目录，保护当前仓库的 .git 不被覆盖
          git clone ${MY_GITHUB_MINI_ACTION_LOGIC_URL} ./logic
          echo "✅ Private logic cloned to ./logic directory."

      # 步骤 2: 开启 KVM 权限(硬件加速的前提)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm && echo "KVM OK"

      # 步骤 3: 启动模拟器,并把整条流水线交给私有仓库的入口脚本
      # 预处理 → 阶段1 采集 → 阶段2 回传 → 阶段3 构建 → 阶段4 推送
      - name: Start Headless Emulator
        env:
          MY_GITHUB_MINI_DATA_DOWNLOADER_URL: ${{ secrets.MY_GITHUB_MINI_DATA_DOWNLOADER_URL }}
          MY_GITEE_PIPELINE_DOWNLOADER_URL: ${{ secrets.MY_GITEE_PIPELINE_DOWNLOADER_URL }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          # default = AOSP 镜像,不含 Google 服务,比 google_apis 轻
          # 想更轻可改成 target: aosp_atd(仅 API 30-33 有该镜像)
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -no-snapshot
            -gpu swiftshader_indirect
          # 公开仓库里只留这一行调用,真正的命令都在私有仓库里
          script: bash "${GITHUB_WORKSPACE}/logic/src/github-action/test-android/run.sh"
